<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beställ – Groundstand UF</title>
<style>
:root{--dark:#101820;--orange:#e97832;--orange2:#ff9b52;--cream:#f7f5f1;--line:#e7e3dc;--muted:#66727c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f5f1,#fff);color:var(--dark);min-height:100vh;padding:30px}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--dark);text-decoration:none;font-weight:800;display:inline-block;margin-bottom:25px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px;box-shadow:0 20px 60px rgba(16,24,32,.10);animation:up .6s ease both}
h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;line-height:.95;margin-bottom:12px}h1 span{color:var(--orange)}
.intro{color:var(--muted);font-size:17px;margin-bottom:30px}.price{font-size:30px;font-weight:900;margin-bottom:28px}
form{display:grid;gap:18px}label{font-weight:800;font-size:14px}input,select,textarea{width:100%;margin-top:7px;padding:14px 15px;border:1px solid #d9d5cf;border-radius:12px;background:#fff;font:inherit;color:var(--dark)}textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.qty{display:flex;gap:10px;align-items:end}.qty input{max-width:130px}.total{background:#f7f1eb;border-radius:14px;padding:16px;font-weight:900;font-size:18px}.btn{border:0;background:var(--dark);color:#fff;padding:16px 22px;border-radius:13px;font-weight:900;font-size:16px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);background:#243541}.note{font-size:13px;color:var(--muted);margin-top:5px}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){body{padding:18px}.card{padding:25px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<a href="index.html">← Till Groundstand UF</a>
<div class="card">
<h1>Beställ <span>Groundstand.</span></h1>
<p class="intro">Fyll i formuläret så kan vi behandla din beställning. Groundstand UF kostar 80 kr per styck.</p>
<div class="price">80 kr / st</div>
<form id="orderForm" action="https://formsubmit.co/utbyouahm@skola.malmo.se" method="POST">
<input type="hidden" name="_subject" value="Ny beställning – Groundstand UF">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="true">
<div class="row">
<label>Förnamn<input name="firstName" required autocomplete="given-name" placeholder="Ditt förnamn"></label>
<label>Efternamn<input name="lastName" required autocomplete="family-name" placeholder="Ditt efternamn"></label>
</div>
<div class="row">
<label>E-post<input type="email" name="email" required autocomplete="email" placeholder="din@email.se"></label>
<label>Telefon<input type="tel" name="phone" autocomplete="tel" placeholder="070-123 45 67"></label>
</div>
<div class="qty">
<label>Antal<input id="quantity" type="number" name="quantity" min="1" value="1" required></label>
</div>
<div class="total">Totalt: <span id="total">80</span> kr</div>
<label>Övrigt<textarea name="message" placeholder="Till exempel önskemål om leverans eller annan information"></textarea></label>
<button class="btn" type="submit">Skicka beställning – 80 kr/st</button>
<p class="note">Efter att du skickat beställningen återkommer Groundstand UF med information om betalning och leverans.</p>
</form>
</div></div>
<script>
const q=document.getElementById('quantity');const total=document.getElementById('total');
function updateTotal(){total.textContent=(Math.max(1,Number(q.value)||1)*80).toLocaleString('sv-SE')}
q.addEventListener('input',updateTotal);updateTotal();
</script>
</body>
</html>
